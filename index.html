<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GLS Jolly Brescia - Rotte</title>
  
  <!-- Configurazione PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#001489">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f4f6f9; color: #333; display: flex; justify-content: center; min-height: 100vh; padding: 15px; }
    .container { width: 100%; max-width: 500px; background: white; padding: 20px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); height: fit-content; }
    
    /* Header GLS */
    .header { text-align: center; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 2px solid #001489; }
    .header h1 { color: #001489; font-size: 26px; font-weight: 800; letter-spacing: -0.5px; }
    .header span { color: #ffc72c; font-weight: 900; }
    .header p { color: #666; font-size: 14px; margin-top: 4px; }

    /* Barra di ricerca */
    .search-box { margin-bottom: 15px; }
    .search-input { width: 100%; padding: 12px 15px; font-size: 15px; border: 1px solid #ccc; border-radius: 8px; outline: none; }
    .search-input:focus { border-color: #001489; }

    /* Cartelle Rotte */
    .route-card { 
      background: #fff; 
      border: 1px solid #e0e0e0; 
      border-left: 6px solid #001489; 
      padding: 14px 16px; 
      border-radius: 10px; 
      margin-bottom: 10px; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      text-decoration: none; 
      color: inherit; 
      transition: background 0.2s; 
    }
    .route-card:active { background: #eef2ff; }
    .route-title { font-weight: bold; font-size: 16px; color: #001489; }
    .route-sub { font-size: 12px; color: #666; margin-top: 4px; }
    .info-group { display: flex; align-items: center; }
    .icon-folder { font-size: 24px; margin-right: 12px; }
    .btn-open { background: #001489; color: white; padding: 8px 14px; border-radius: 6px; font-size: 13px; font-weight: bold; }
    .empty-state { text-align: center; color: #888; padding: 30px 10px; font-size: 14px; }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>GLS <span>Jolly</span></h1>
    <p>Elenco Rotte Brescia</p>
  </div>

  <!-- Cerca Rotta -->
  <div class="search-box">
    <input type="text" id="search" class="search-input" placeholder="🔍 Cerca rotta o comune..." onkeyup="filterRoutes()">
  </div>

  <!-- Lista Rotte -->
  <div id="routes-list"></div>
</div>

<script>
  /* 
    ======================================================
    ELENCO COMPLETO ROTTE GLS BRESCIA (15 ROTTE)
    ======================================================
  */
  const ROTTE = [
    { codice: "ROTTA BE", zona: "Calcinato - Ponte San Marco", pdf: "ROTTA BE.pdf" },
    { codice: "ROTTA BI", zona: "Gavardo - Soprazocco - San Biagio", pdf: "ROTTA BI.pdf" },
    { codice: "ROTTA BJ", zona: "Gavardo - Vallio Terme - Villanuova", pdf: "ROTTA BJ.pdf" },
    { codice: "ROTTA BK", zona: "Villanuova s/C - Roè Volciano", pdf: "ROTTA BK.pdf" },
    { codice: "ROTTA CA-CC", zona: "Castel Mella - Roncadelle", pdf: "ROTTA CA-CC.pdf" },
    { codice: "ROTTA CF", zona: "Poncarale - Montirone", pdf: "ROTTA CF.pdf" },
    { codice: "ROTTA DA", zona: "Lonato del Garda", pdf: "ROTTA DA.pdf" },
    { codice: "ROTTA DF", zona: "Desenzano - San Martino - Pozzolengo", pdf: "ROTTA DF.pdf" },
    { codice: "ROTTA SA", zona: "Odolo - Preseglie - Agnosine - Bione", pdf: "ROTTA SA.pdf" },
    { codice: "ROTTA SB", zona: "Vestone - Nozza", pdf: "ROTTA SB.pdf" },
    { codice: "ROTTA TD", zona: "Villa Carcina", pdf: "ROTTA TD.pdf" },
    { codice: "ROTTA TN", zona: "Cellatica - Gussago - Mandolossa", pdf: "ROTTA TN.pdf" },
    { codice: "ROTTA VM", zona: "Alta Valle (Monno, Vezza, Temù, Vione)", pdf: "ROTTA VM.pdf" },
    { codice: "ROTTA XC", zona: "Salò (Centro, ZTL e Collinare)", pdf: "ROTTA XC.pdf" },
    { codice: "ROTTA XD-XH", zona: "Puegnago - Salò - San Felice - Portese", pdf: "ROTTA XD-XH.pdf" }
  ];

  function renderRoutes(data) {
    const list = document.getElementById('routes-list');
    list.innerHTML = '';

    if (data.length === 0) {
      list.innerHTML = `<div class="empty-state">Nessuna rotta trovata.</div>`;
      return;
    }

    // Ordina alfabeticamente per Codice Rotta
    data.sort((a, b) => a.codice.localeCompare(b.codice));

    data.forEach(r => {
      const card = document.createElement('a');
      card.className = 'route-card';
      card.href = encodeRFC3986URIComponent(r.pdf);
      card.target = "_blank";
      card.innerHTML = `
        <div class="info-group">
          <span class="icon-folder">📁</span>
          <div>
            <div class="route-title">${r.codice}</div>
            <div class="route-sub">${r.zona}</div>
          </div>
        </div>
        <div class="btn-open">Apri PDF</div>
      `;
      list.appendChild(card);
    });
  }

  // Gestione spazi e caratteri nei nomi dei file PDF
  function encodeRFC3986URIComponent(str) {
    return encodeURIComponent(str).replace(/[!'()*]/g, function(c) {
      return '%' + c.charCodeAt(0).toString(16);
    });
  }

  function filterRoutes() {
    const query = document.getElementById('search').value.toLowerCase();
    const filtered = ROTTE.filter(r => 
      r.codice.toLowerCase().includes(query) || 
      r.zona.toLowerCase().includes(query)
    );
    renderRoutes(filtered);
  }

  // Avvio
  renderRoutes(ROTTE);

  // Registrazione Service Worker PWA
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
  }
</script>

</body>
</html>
